# ═══════════════════════════════════════════════════════════════════
#  BungeeSystem – Ban/Mute/Report · Freunde/Party/Clan · Onlinezeit · Chat
#  Alle Texte stehen in der messages.yml.
# ═══════════════════════════════════════════════════════════════════

# Dieselbe Datenbank wie LobbySystem & MissileWars (sonst keine gemeinsamen Freunde/Clans/Coins).
mysql:
  host: localhost
  port: 3306
  database: lobby
  user: root
  password: ''
  pool-size: 3
  properties: useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC

# Module an/aus (nach Änderung Proxy neu starten; kurzzeitig: /bungeesystem modules disable <Modul>)
modules:
  # Strafen & Team
  punish: true
  report: true
  notify: true
  warn: true
  exemption: true
  teamchat: true
  adminchat: true
  teamonline: true
  jointo: true
  whereis: true
  staffstats: true
  support: true
  bugreport: true
  # Social
  friends: true
  party: true
  clan: true
  onlinetime: true
  # Chat
  chat: true
  cmdblock: true
  # Netzwerk
  maintenance: true
  motd: true
  hub: true
  servers: true
  broadcast: true
  autobroadcast: true
  help: true
  links: true
  ping: true
  online: true
  whereami: true
  debug: true
  # Community
  poll: true
  joinme: true
  advert: true
  coins: true
  rankinfo: true
  # Extern (erst Zugangsdaten unten eintragen)
  discord: false
  teamspeak: false

# Spielerzahlen aller Server mit Spielern in ls_servers schreiben (Freunde-Status in der Lobby)
sync-server-status: true

# Befehlsnamen & Aliase – erster Eintrag = Hauptname, leere Liste [] = Befehl aus.
commands:
  ban: [ban, tempban, tban]
  mute: [mute, tempmute]
  unban: [unban, pardon]
  unmute: [unmute]
  kick: [kick]
  check: [check, baninfo]
  history: [history, strafen]
  punish: [punish, bansystem, bs]
  banreasons: [banreasons, gründe]
  report: [report, melden]
  reports: [reports]
  notify: [notify]
  friend: [friend, f, freunde, friends]
  msg: [msg, tell, w, whisper]
  reply: [r, reply]
  party: [party, p]
  partychat: [pc, partychat]
  clan: [clan, clans]
  clanchat: [cc, clanchat]
  onlinetime: [onlinetime, onlinezeit, ot]
  globalmute: [globalmute, gmute]
  chatclear: [chatclear, clearchat]
  chat: [chat, togglechat]
  teamchat: [teamchat, tc]
  adminchat: [adminchat, ac]
  teamonline: [teamonline, teaminfo]
  jointo: [jointo, goto]
  whereis: [whereis, find]
  staffstats: [staff, staffstats]
  warn: [warn, warns]
  exemption: [exemption, ea]
  support: [support]
  bugreport: [bugreport, bug]
  maintenance: [maintenance, wartung]
  motd: [motd]
  # /l und /lobby: in einer Lobby wird man zum Spawn teleportiert (LobbySystem)
  hub: [hub, lobby, l]
  broadcast: [broadcast, bc]
  help: [help, hilfe]
  ping: [ping]
  online: [online]
  whereami: [whereami]
  debugreset: [debugreset]
  poll: [poll, umfrage]
  joinme: [joinme]
  advert: [advert, geworben]
  coins: [coins]
  rankinfo: [rankinfo]
  tsbot: [tsbot]
  tsverify: [tsverify]
  admin: [bungeesystem, bsys]

# ─── Ban / Mute ─────────────────────────────────────────────────────
punish:
  # Bei einem Ban wird auch die IP gesperrt → kein Umgehen mit Zweitaccount
  ip-ban: true
  # Ban/Mute zusätzlich allen Spielern anzeigen (sonst nur dem Team über /notify)
  broadcast: false
  # Gleiche Vorlage erneut → Dauer verdoppelt sich, ab N Bans permanent
  escalation:
    enabled: true
    permanent-after: 4
  # Dauer für eigene Mute-Gründe ohne Zeitangabe
  custom-mute-duration: 1d
  # Diese Server-Befehle sind während eines Mutes gesperrt
  mute-blocked-commands: [me, say, tell, msg, w, whisper, r, reply, mail, minecraft:me, minecraft:say]
  # Vorlagen: /ban <Spieler> <ID>   |   duration: 30m, 12h, 7d, 2w, 1mo, perm
  # Eigene Gründe (/ban <Spieler> <Dauer> <Grund>) nur mit bungeesystem.ban.custom bzw. bungeesystem.mute.custom
  reasons:
    '1': { name: Hacking, type: BAN, duration: 30d, item: DIAMOND_SWORD }
    '2': { name: Unerlaubte Clientmodifikation, type: BAN, duration: 14d, item: COMMAND_BLOCK }
    '3': { name: Bugusing, type: BAN, duration: 7d, item: SPIDER_EYE }
    '4': { name: Teaming, type: BAN, duration: 3d, item: LEAD }
    '5': { name: Werbung, type: BAN, duration: 14d, item: OAK_SIGN }
    '6': { name: Unangemessener Skin/Name, type: BAN, duration: 7d, item: PLAYER_HEAD }
    '7': { name: Bannumgehung, type: BAN, duration: perm, item: TNT }
    '8': { name: Beleidigung, type: MUTE, duration: 1d, item: PAPER }
    '9': { name: Spam, type: MUTE, duration: 6h, item: WRITABLE_BOOK }
    '10': { name: Provokation, type: MUTE, duration: 12h, item: BLAZE_POWDER }
    '11': { name: Rassismus / Extremismus, type: MUTE, duration: 30d, item: BARRIER }
    '99': { name: Permanent (Admin), type: BAN, duration: perm, permission: bungeesystem.ban.permanent, item: BEDROCK }

# ─── Report ─────────────────────────────────────────────────────────
report:
  cooldown-seconds: 60
  only-online: true
  # true = Spieler dürfen auch eigene Gründe schreiben
  custom-reasons: false
  reasons: [Hacking, Beleidigung, Spam, Werbung, Teaming, Bugusing, Skin, Name, Sonstiges]

# ─── Freunde / Privatnachrichten ────────────────────────────────────
friends:
  max: 50
  max-premium: 200          # mit bungeesystem.friends.premium
  no-jump-servers: []       # z. B. ["Event*"] – dort kann man nicht nachspringen
private-messages:
  enabled: true
  only-friends: false       # true = /msg nur an Freunde

# ─── Party ──────────────────────────────────────────────────────────
party:
  max: 8
  max-premium: 16           # mit bungeesystem.party.premium
  invite-seconds: 60
  follow: true              # Mitglieder folgen dem Leader auf jeden Server
  follow-ignore: []         # Server, auf die nicht mitgenommen wird, z. B. ["Build*"]

# ─── Clan ───────────────────────────────────────────────────────────
clan:
  cost: 5000                # Coins (LobbySystem-Guthaben), bungeesystem.clan.free = kostenlos
  name-max: 16
  tag-min: 2
  tag-max: 5
  max-members: 30
  invite-seconds: 300
  blocked-names: [admin, owner, team, support]

# ─── Chat ───────────────────────────────────────────────────────────
chat:
  enabled: true
  clear-lines: 120
  anti-spam:
    enabled: true
    cooldown-ms: 1500
    # Nachrichten, die einer der letzten zu X % ähneln, werden blockiert (0 = aus)
    similarity: 85
    compare-last: 3
    min-length: 4
  caps:
    enabled: true
    min-length: 6
    max-percent: 70
  filter:
    enabled: true
    block-ips: true
    block-domains: true
    domain-whitelist: [crafterteam.de, youtube.com, discord.gg/crafterteam]
    # BLOCK = Nachricht sperren, CENSOR = Wort durch *** ersetzen (nur auf Servern mit Proxy-Chatformat)
    action: BLOCK
    words: [hurensohn, wichser, nazi, heil hitler, fotze, missgeburt]
  mentions:
    enabled: true
    format: '&e&l@{name}'
  # Chat-Format auf dem Proxy. Nicht formatierte Server (ignored-servers) behalten ihr eigenes Format
  # (z. B. Teamchat in MissileWars). Platzhalter: {clan} {prefix} {name} {suffix} {server} {message}
  format:
    enabled: true
    scope: SERVER             # SERVER = nur Spieler auf demselben Server, GLOBAL = alle
    ignored-servers: ['MissileWars*']
    format: '{clan}{prefix}{name}{suffix} &8» &7{message}'
    clan: '&8[&e{tag}&8] '
    use-luckperms: true       # Prefix/Suffix aus LuckPerms (falls installiert)
    # Ohne LuckPerms: erste passende Gruppe (Reihenfolge zählt, leere permission = alle)
    groups:
      owner: { permission: bungeesystem.chat.group.owner, prefix: '&4Owner &8┃ &4', suffix: '' }
      admin: { permission: bungeesystem.chat.group.admin, prefix: '&cAdmin &8┃ &c', suffix: '' }
      mod: { permission: bungeesystem.chat.group.mod, prefix: '&9Mod &8┃ &9', suffix: '' }
      sup: { permission: bungeesystem.chat.group.sup, prefix: '&bSup &8┃ &b', suffix: '' }
      premium: { permission: bungeesystem.chat.group.premium, prefix: '&6Premium &8┃ &6', suffix: '' }
      default: { permission: '', prefix: '&7', suffix: '' }

# ─── CMDBlock ───────────────────────────────────────────────────────
cmdblock:
  enabled: true
  # Befehle mit Namespace (bukkit:..., minecraft:...) immer sperren
  block-namespaced: true
  # '*' am Ende = alles, was so beginnt
  commands: [pl, plugins, ver, version, about, icanhasbukkit, '?', bukkit, paper, spigot, timings, me, tps, mspt]

# ═══════════════════════════════════════════════════════════════════
#  Team-Tools
# ═══════════════════════════════════════════════════════════════════
warn:
  max: 3                    # ab so vielen aktiven Verwarnungen automatisch Ban
  ban-reason: ''            # ID einer Vorlage aus punish.reasons (leer = eigener Grund + ban-duration)
  ban-duration: 3d

bugreport:
  reward-coins: 250         # Coins für angenommene Bugs
  max-open: 3

# ═══════════════════════════════════════════════════════════════════
#  Netzwerk
# ═══════════════════════════════════════════════════════════════════
# MOTD in der Serverliste. Ingame änderbar: /motd normal|wartung 1|2 <Text>
# Platzhalter {online} {max} · Sonderzeichen [>] » · [<] « · [o] ● · [*] ✦ · [|] ┃ · Hex &#rrggbb
motd:
  normal:
    line1: '&#00d2ff&lCRAFTERTEAM &8[|] &7Dein Minecraft-Netzwerk'
    line2: '&8[>] &eMissileWars &8[o] &aLobby &8[o] &bEvents'
  maintenance:
    line1: '&#00d2ff&lCRAFTERTEAM &8[|] &cWartungsarbeiten'
    line2: '&7Wir sind bald wieder da! &8[>] &bdiscord.gg/crafterteam'
    version: '&4✖ Wartung'
    version-release: '&cRelease in {remaining}'

hub:
  servers: ['Lobby*']       # Lobby mit den wenigsten Spielern wird gewählt

# Eigene Befehle, die auf einen Server schicken
server-commands:
  bauserver: { server: Build-1, permission: bungeesystem.server.build, aliases: [buildserver] }
  devserver: { server: Dev-1, permission: bungeesystem.server.dev, aliases: [] }
  testserver: { server: Test-1, permission: bungeesystem.server.test, aliases: [] }

autobroadcast:
  interval-seconds: 300
  random: false
  ignored-servers: []
  messages:
    - '{prefix}&7Besuche unseren Discord: [&b&ndiscord.gg/crafterteam](url:https://discord.gg/crafterteam|&7Öffnen)'
    - '{prefix}&7Regelverstoß gesehen? Melde ihn mit &e/report <Spieler> <Grund>&7.'
    - ['{prefix}&7Lade deine Freunde ein!', '{prefix}&7Mit &e/advert <Name> &7bekommt ihr beide Coins.']

help:
  pages:
    '1':
      - '&8&m        &r &#00d2ff&lHILFE &8(&7{page}/{pages}&8) &8&m        '
      - '&8[>] &e/friend &8┃ &7Freunde · &e/party &8┃ &7Party · &e/clan &8┃ &7Clan'
      - '&8[>] &e/msg &8┃ &7Nachricht · &e/report &8┃ &7Spieler melden'
      - '&8[>] &e/hub &8┃ &7Zur Lobby · &e/onlinetime &8┃ &7Onlinezeit'
      - '&8[>] [&7weiter »](/{cmd} {next})'
    '2':
      - '&8&m        &r &#00d2ff&lHILFE &8(&7{page}/{pages}&8) &8&m        '
      - '&8[>] &e/support &8┃ &7Hilfe vom Team · &e/bugreport &8┃ &7Bug melden'
      - '&8[>] &e/discord &8┃ &e/ts &8┃ &e/web &8┃ &7Links'
      - '&8[>] &e/advert <Name> &8┃ &7Wer hat dich eingeladen?'
      - '&8[>] [&7« zurück](/{cmd} {prev})'

links:
  discord:
    aliases: [dc]
    lines: ['{prefix}&7Discord: [&b&ndiscord.gg/crafterteam](url:https://discord.gg/crafterteam|&7Öffnen)']
  teamspeak:
    aliases: [ts]
    lines: ['{prefix}&7TeamSpeak: &bts.crafterteam.de']
  web:
    aliases: [website]
    lines: ['{prefix}&7Website: [&b&ncrafterteam.de](url:https://crafterteam.de|&7Öffnen)']
  forum:
    aliases: []
    lines: ['{prefix}&7Forum: [&b&ncrafterteam.de/forum](url:https://crafterteam.de/forum|&7Öffnen)']

# ═══════════════════════════════════════════════════════════════════
#  Community
# ═══════════════════════════════════════════════════════════════════
poll:
  vote-permission: false    # true = nur mit bungeesystem.poll.vote abstimmen

joinme:
  cooldown-seconds: 300
  valid-seconds: 300
  head: true                # Kopf des Spielers als 8×8-Pixel im Chat
  head-url: 'https://mc-heads.net/avatar/{uuid}/8.png'
  blocked-servers: []

advert:
  reward-new: 250           # neuer Spieler
  reward-referrer: 500      # Werber
  max-days: 7               # nur in den ersten X Tagen nach dem ersten Join

# ═══════════════════════════════════════════════════════════════════
#  Discord (Webhooks: Kanal-Einstellungen → Integrationen → Webhooks → URL kopieren)
# ═══════════════════════════════════════════════════════════════════
discord:
  username: CrafterTeam
  # Nachricht mit Status/MOTD/Spielern – wird regelmäßig bearbeitet
  status-webhook: ''
  status-interval-seconds: 60
  status-title: CrafterTeam Netzwerk
  server-ip: play.crafterteam.de
  icon-url: ''
  # Log für Strafen & Co.
  log-webhook: ''
  log-types: [ban, mute, kick]
  log-titles:
    ban: '🔨 Ban'
    mute: '🔇 Mute'
    kick: '👢 Kick'
    report: '🚩 Report'
    chat: '💬 Chat-Filter'

# ═══════════════════════════════════════════════════════════════════
#  TeamSpeak 3 (ServerQuery-Zugang: Tools → ServerQuery-Login im TS-Client)
# ═══════════════════════════════════════════════════════════════════
teamspeak:
  host: localhost
  query-port: 10011
  server-port: 9987
  query-user: serveradmin
  query-password: ''
  nickname: CrafterTeam-Bot
  address: ts.crafterteam.de
  support:
    channel-id: 0           # Support-Warteraum
    name-open: '[cspacer]» Support | Geöffnet'
    name-closed: '[cspacer]» Support | Geschlossen'
    staff-groups: [6]       # Servergruppen-IDs, die !open/!close dürfen
    notify-group: 0         # !notify – Gruppe für Support-Benachrichtigungen
    quiet-group: 0          # !ruhe – "Bitte nicht stören"-Gruppe
  verify:
    group: 0                # Servergruppe nach /tsverify
    require-same-ip: true   # TS & Minecraft müssen von derselben IP kommen
    description: 'Minecraft: {name}'
  texts:
    code: 'Dein Minecraft-Code: {code} – gib ingame /tsverify {code} ein.'
    help: 'Befehle: !open, !close, !notify, !ruhe'
    opened: 'Support geöffnet.'
    closed: 'Support geschlossen.'
    no-rights: 'Dazu hast du keine Rechte.'
    error: 'Das hat nicht geklappt.'
