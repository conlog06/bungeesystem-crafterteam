  list-footer: '&8» [&7« zurück](/{cmd} list {prev}) &8┃ [&7weiter »](/{cmd} list {next})'
  requests-header: '{prefix}&7Offene Anfragen: &f{count}'
  same-server: '{prefix}&7Du bist bereits auf dem Server von &e{player}&7.'
  jump-blocked: '{prefix}&cAuf &e{server} &ckann man nicht nachspringen.'
  jump: '{prefix}&7Du springst zu &e{player} &7auf &f{server}&7…'
  toggle-requests: '{prefix}&7Freundschaftsanfragen: {state}'
  toggle-notify: '{prefix}&7Online-Benachrichtigungen: {state}'
