  sent: '{prefix}&aDanke! &7Dein Report gegen &e{player} &7(&f{reason}&7) wurde an das Team gesendet.'
  notify: '{prefix}&e{reporter} &7meldet &c{player} &7wegen &f{reason} &8({server}) &8┃ [&a&lANNEHMEN](/{cmd} accept {id}|&aReport #{id} übernehmen) [&c&lSCHLIESSEN](/{cmd} close {id}|&cReport #{id} schließen)'
