# ═══════════════════════════════════════════════════════════════════
#  BungeeSystem – alle Nachrichten
#  Farben: &a &l … und Hex &#00d2ff · Zeilenumbruch: \n oder Liste
#  Buttons: [Text](/befehl) · [Text](/befehl|Hover-Text) · [Text](suggest:/befehl ) · [Text](url:https://…)
#  {prefix} = Prefix des Moduls (siehe unten)
# ═══════════════════════════════════════════════════════════════════

prefix:
  default: '&#3a7bd5&lSYSTEM &8» &7'
  general: '&#3a7bd5&lSYSTEM &8» &7'
  ban: '&#ff4b2b&lBAN &8» &7'
  unban: '&#ff4b2b&lBAN &8» &7'
  mute: '&#f7971e&lMUTE &8» &7'
  unmute: '&#f7971e&lMUTE &8» &7'
  kick: '&#ff4b2b&lKICK &8» &7'
  punish: '&#ff4b2b&lSTRAFEN &8» &7'
  check: '&#3a7bd5&lCHECK &8» &7'
  history: '&#3a7bd5&lHISTORY &8» &7'
  report: '&#e94057&lREPORT &8» &7'
  notify: '&#8e2de2&lNOTIFY &8» &7'
  friend: '&#56ab2f&lFREUNDE &8» &7'
  msg: '&#56ab2f&lMSG &8» &7'
  party: '&#c471ed&lPARTY &8» &7'
  clan: '&#f9d423&lCLAN &8» &7'
  onlinetime: '&#00d2ff&lONLINEZEIT &8» &7'
  chat: '&#00d2ff&lCHAT &8» &7'
  cmdblock: '&#3a7bd5&lSYSTEM &8» &7'

general:
  no-permission: '{prefix}&cDazu hast du keine Rechte.'
  only-players: '{prefix}&cNur für Spieler.'
  player-not-found: '{prefix}&cDer Spieler &e{player} &cwurde nicht gefunden.'
  player-offline: '{prefix}&e{player} &cist nicht online.'
  server-not-found: '{prefix}&cDer Server &e{server} &cexistiert nicht.'
  error: '{prefix}&cEs ist ein Fehler aufgetreten.'
  no-addon: '{prefix}&7Auf diesem Server ist das &eBungeeSystem-Addon &7nicht installiert – Liste im Chat:'
  reloaded: '{prefix}&aKonfiguration & Nachrichten neu geladen.'
  info: '{prefix}&fBungeeSystem &7v{version} &8┃ &7Module: &f{modules} &8┃ &7Online: &f{players}'
  'on': '&aan'
  'off': '&caus'
  'yes': '&aJa'
  'no': '&cNein'

# ─── Ban ────────────────────────────────────────────────────────────
ban:
  usage: '{prefix}&7/{cmd} <Spieler> &8[&7ID&8] &7oder &7/{cmd} <Spieler> <Dauer> <Grund>'
  success: '{prefix}&e{player} &7wurde gebannt &8(&7{reason}&8, &f{duration}&8) &8{id}'
  already: '{prefix}&e{player} &cist bereits gebannt.'
  notify: '{prefix}&e{player} &7wurde von &e{staff} &cpermanent &7gebannt. &8┃ &7Grund: &f{reason} &8{id}'
  notify-temp: '{prefix}&e{player} &7wurde von &e{staff} &7für &e{duration} &7gebannt. &8┃ &7Grund: &f{reason} &8{id}'
  notify-ip: '{prefix}&e{player} &7wollte mit der IP des gebannten Spielers &e{banned} &7joinen &8({id})'
  broadcast: '{prefix}&e{player} &7wurde vom Netzwerk ausgeschlossen. &8┃ &7Grund: &f{reason}'
  screen:
    - '&#ff4b2b&lCRAFTERTEAM'
    - ''
    - '&cDu wurdest &4permanent &cvom Netzwerk gebannt.'
    - ''
    - '&7Grund: &f{reason}'
    - '&7Von: &f{staff} &8┃ &7Am: &f{date}'
    - '&7Ban-ID: &f{id}'
    - ''
    - '&7Entbannungsantrag: &bdiscord.gg/crafterteam'
  screen-temp:
    - '&#ff4b2b&lCRAFTERTEAM'
    - ''
    - '&cDu wurdest vom Netzwerk gebannt.'
    - ''
    - '&7Grund: &f{reason}'
    - '&7Verbleibend: &e{remaining} &8(&7bis {until}&8)'
    - '&7Ban-ID: &f{id}'
    - ''
    - '&7Entbannungsantrag: &bdiscord.gg/crafterteam'
unban:
  usage: '{prefix}&7/{cmd} <Spieler> [Grund]'
  success: '{prefix}&e{player} &7wurde &aentbannt&7.'
  not: '{prefix}&e{player} &cist nicht gebannt.'
  notify: '{prefix}&e{player} &7wurde von &e{staff} &aentbannt&7. &8{reason}'

# ─── Mute ───────────────────────────────────────────────────────────
mute:
  usage: '{prefix}&7/{cmd} <Spieler> &8[&7ID&8] &7oder &7/{cmd} <Spieler> <Dauer> <Grund>'
  success: '{prefix}&e{player} &7wurde gemutet &8(&7{reason}&8, &f{duration}&8) &8{id}'
  muted:
    - '{prefix}&cDu wurdest gemutet!'
    - '{prefix}&7Grund: &f{reason} &8┃ &7Dauer: &e{duration}'
  blocked: '{prefix}&cDu bist gemutet. &7Grund: &f{reason} &8┃ &7Noch: &e{remaining}'
  notify: '{prefix}&e{player} &7wurde von &e{staff} &7für &e{duration} &7gemutet. &8┃ &7Grund: &f{reason} &8{id}'
  broadcast: '{prefix}&e{player} &7wurde gemutet. &8┃ &7Grund: &f{reason}'
unmute:
  usage: '{prefix}&7/{cmd} <Spieler> [Grund]'
  success: '{prefix}&e{player} &7wurde &aentmutet&7.'
  not: '{prefix}&e{player} &cist nicht gemutet.'
  notify: '{prefix}&e{player} &7wurde von &e{staff} &aentmutet&7. &8{reason}'
  target: '{prefix}&aDu wurdest entmutet und kannst wieder schreiben.'

# ─── Kick ───────────────────────────────────────────────────────────
kick:
  usage: '{prefix}&7/{cmd} <Spieler> [Grund]'
  success: '{prefix}&e{player} &7wurde gekickt. &8(&7{reason}&8)'
  no-reason: 'Kein Grund angegeben'
  notify: '{prefix}&e{player} &7wurde von &e{staff} &7gekickt &8(&7{server}&8). &7Grund: &f{reason}'
  screen:
    - '&#ff4b2b&lCRAFTERTEAM'
    - ''
    - '&cDu wurdest vom Netzwerk gekickt.'
    - ''
    - '&7Grund: &f{reason}'
    - '&7Von: &f{staff}'

# ─── Vorlagen / GUI ─────────────────────────────────────────────────
punish:
  reasons-header: '{prefix}&7Gründe für &e{player}&7:'
  reasons-entry: '&8» [&e#{id} &f{name} &8(&7{type}&8, &e{duration}&8)]({command}|&7Klicken zum Bestrafen)'
  unknown-reason: '{prefix}&cUnbekannte Vorlage &e{id}&c.'
  wrong-type: '{prefix}&cVorlage &e#{id} &c({name}) gehört zum anderen Befehl (Ban ↔ Mute).'
  no-permanent: '{prefix}&cDu darfst keine permanenten Strafen vergeben.'
  self: '{prefix}&cDu kannst dich nicht selbst bestrafen.'
  protected: '{prefix}&e{player} &ckann nicht bestraft werden.'
  gui-usage: '{prefix}&7/{cmd} <Spieler>'

