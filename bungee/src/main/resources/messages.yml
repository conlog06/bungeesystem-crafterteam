  list-entry: '&8» &f#{id} &c{player} &8┃ &f{reason} &8┃ &7von &f{reporter} &8┃ {status} [&a✔](/{cmd} accept {id}|&aAnnehmen) [&c✖](/{cmd} close {id}|&cSchließen)'
  status-open: '&eoffen'
  status-progress: '&bin Bearbeitung &7({handler})'
  reminder: '{prefix}&7Es gibt &e{count} &7offene Reports. [&e&lANZEIGEN](/{cmd}|&7Reports öffnen)'

