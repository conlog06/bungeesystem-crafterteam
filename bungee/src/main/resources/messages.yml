  header: '&8&m          &r &#3a7bd5&l{player} &8&m          '
  status: '&8» &7Status: {status}'
  online: '&aOnline &8(&7{server}&8)'
  offline: '&cOffline &8(&7zuletzt {date}&8)'
  first-join: '&8» &7Erster Join: &f{date}'
  onlinetime: '&8» &7Onlinezeit: &f{time}'
  banned: '&8» &7Ban: &cJa &8┃ &f{reason} &8┃ &7von &f{staff} &8┃ &7noch &e{remaining} &8{id}'
  not-banned: '&8» &7Ban: &aNein'
  muted: '&8» &7Mute: &cJa &8┃ &f{reason} &8┃ &7von &f{staff} &8┃ &7noch &e{remaining} &8{id}'
  not-muted: '&8» &7Mute: &aNein'
  ip: '&8» &7IP: &f{ip}'
  alts: '&8» &7Gleiche IP: &f{alts}'
history:
  usage: '{prefix}&7/{cmd} <Spieler>'
  header: '&8&m          &r &#3a7bd5&lHistory {player} &8(&f{count}&8) &8&m          '
  empty: '&8» &7Keine Einträge.'
  entry: '&8» &f{type} &8{id} &7{date} &8┃ &f{reason} &8┃ &7{duration} &8┃ &7von &f{staff} &8┃ {state}'
  kick: '&8» &fKick &7{date} &8┃ &f{reason} &8┃ &7von &f{staff}'
  state-active: '&caktiv'
  state-expired: '&7abgelaufen'
  state-removed: '&aaufgehoben &7({staff})'

# ─── Report ─────────────────────────────────────────────────────────
report:
  usage: '{prefix}&7/{cmd} <Spieler> <Grund> &8┃ &7Gründe: &f{reasons}'
  reason-button: '&8» [&e{reason}]({command}|&7Mit diesem Grund melden)'
