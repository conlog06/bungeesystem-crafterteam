  cooldown: '{prefix}&cBitte warte noch &e{seconds}s&c.'
  invalid-reason: '{prefix}&cUngültiger Grund. &7Erlaubt: &f{reasons}'
  protected: '{prefix}&e{player} &ckann nicht gemeldet werden.'
  already: '{prefix}&cDu hast &e{player} &cbereits gemeldet.'
  sent: '{prefix}&aDanke! &7Dein Report gegen &e{player} &7(&f{reason}&7) wurde an das Team gesendet.'
  notify: '{prefix}&e{reporter} &7meldet &c{player} &7wegen &f{reason} &8({server}) &8┃ [&a&lANNEHMEN](/{cmd} accept {id}|&aReport #{id} übernehmen) [&c&lSCHLIESSEN](/{cmd} close {id}|&cReport #{id} schließen)'
  notify-accepted: '{prefix}&e{staff} &7bearbeitet Report &f#{id} &7(&e{player}&7).'
  accepted: '{prefix}&7Du bearbeitest jetzt Report &f#{id} &7gegen &e{player}&7.'
  taken: '{prefix}&cReport #{id} wird bereits von &e{handler} &cbearbeitet.'
  closed: '{prefix}&7Report &f#{id} &7wurde geschlossen.'
  not-found: '{prefix}&cReport &e#{id} &cnicht gefunden.'
  target-offline: '{prefix}&e{player} &7ist gerade nicht online.'
  reporter-accepted: '{prefix}&7Dein Report gegen &e{player} &7wird jetzt bearbeitet.'
  reporter-closed: '{prefix}&7Dein Report gegen &e{player} &7wurde abgeschlossen. Danke!'
  list-header: '{prefix}&7Offene Reports: &f{count}'
  list-empty: '&8» &aKeine offenen Reports.'
  list-entry: '&8» &f#{id} &c{player} &8┃ &f{reason} &8┃ &7von &f{reporter} &8┃ {status} [&a✔](/{cmd} accept {id}|&aAnnehmen) [&c✖](/{cmd} close {id}|&cSchließen)'
  status-open: '&eoffen'
  status-progress: '&bin Bearbeitung &7({handler})'
  reminder: '{prefix}&7Es gibt &e{count} &7offene Reports. [&e&lANZEIGEN](/{cmd}|&7Reports öffnen)'

# ─── Notify ─────────────────────────────────────────────────────────
notify:
  header: '{prefix}&7Deine Benachrichtigungen:'
  entry: '&8» &f{type}&7: {state} [&8[&7umschalten&8]](/{cmd} {type})'
  toggled: '{prefix}&7Benachrichtigungen &f{type}&7: {state}'
  usage: '{prefix}&7/{cmd} <{types}|all>'

